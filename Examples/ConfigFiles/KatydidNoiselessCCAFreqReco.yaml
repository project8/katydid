processor-toolbox:

    processors:

        - type: egg-processor
          name: egg1
        - type: gaussian-noise-generator
          name: noise-gen1
        - type: forward-fftw
          name: fft1
        - type: convert-to-power
          name: to-ps1

        - type: egg-processor
          name: egg2
        - type: gaussian-noise-generator
          name: noise-gen2
        - type: forward-fftw
          name: fft2
        - type: convert-to-power
          name: to-ps2

        - type: data-accumulator
          name: acc
        - type: gain-variation
          name: gainvar

        - type: variable-spectrum-discriminator
          name: discrim
        - type: sequential-track-finder
          name: seq-tr-clust
        - type: overlapping-track-clustering
          name: otc
        - type: iterative-track-clustering
          name: itc
        - type: track-proc-ws
          name: tr-proc-ws
        - type: multi-peak-track-builder
          name: mptb
        - type: multi-peak-event-builder
          name: mpeb
        - type: cavity-event-processing
          name: cavity-event-proc

        - type: apply-cut
          name: ac1b
        - type: apply-cut
          name: event-nup-cut
        - type: apply-cut
          name: event-time-cut

        - type: basic-root-writer
          name: brw
        - type: root-tree-writer
          name: trw

    connections:

        # Header processing
        - signal: "egg1:header"
          slot: "fft1:header"
        - signal: "egg1:ts"
          slot: "noise-gen1:slice"
        - signal: "noise-gen1:slice"
          slot: "fft1:ts-fftw"
        
        # First egg processing
        - signal: "fft1:fft"
          slot: "to-ps1:fs-fftw-to-psd"
        - signal: "to-ps1:psd"
          slot: "acc:ps"
        - signal: "acc:ps-finished"
          slot: "gainvar:ps-var"
        # - signal: "acc:ps-finished"
        #  slot: "brw:psd"                 # Write accumulated PSD histogram
        # - signal: "gainvar:gain-var"
        #  slot: "brw:gain-var"            # Write gain-var histogram
        - signal: "gainvar:gain-var"
          slot: "discrim:gv"

        # Second egg processing
        - signal: "egg2:header"
          slot: "fft2:header"
        - signal: "egg2:ts"
          slot: "noise-gen2:slice"
        - signal: "noise-gen2:slice"
          slot: "fft2:ts-fftw"
        - signal: "fft2:fft"
          slot: "to-ps2:fs-fftw-to-psd"
        - signal: "to-ps2:psd"
          slot: "discrim:ps-pre"
        - signal: "discrim:disc-1d"
          slot: "seq-tr-clust:disc-1d"
#        - signal: "discrim:disc-1d"
#          slot: "trw:disc-1d"             # Writing discriminated points to ROOT tree
        - signal: "seq-tr-clust:seq-cand"
          slot: "otc:seq-cand"
        - signal: "otc:seq-cand"
          slot: "itc:seq-cand"
        - signal: "itc:seq-cand"
          slot: "ac1b:apply"
        - signal: "ac1b:pass"
          slot: "tr-proc-ws:seq-cand"
        - signal: "tr-proc-ws:track"
          slot: "mptb:track"
        - signal: "tr-proc-ws:track"
          slot: "trw:proc-track"          # Write processed tracks to a ROOT tree
        - signal: "egg2:egg-done"
          slot: "seq-tr-clust:done"
        - signal: "seq-tr-clust:clustering-done"
          slot: "otc:do-clustering"
        - signal: "otc:clustering-done"
          slot: "itc:do-clustering"
        - signal: "itc:clustering-done"
          slot: "mptb:do-clustering"
        - signal: "mptb:mpt"
          slot: "mpeb:mpt"
        - signal: "mptb:mpt-done"
          slot: "mpeb:do-clustering"
        - signal: "mpeb:event"
          slot: "event-nup-cut:apply"
        - signal: "event-nup-cut:pass"
          slot: "event-time-cut:apply"
        - signal: "event-time-cut:pass"
          slot: "trw:mt-event"
        - signal: "event-time-cut:pass"
          slot: "cavity-event-proc:mt-event"
        - signal: "cavity-event-proc:proc-cavity-event"
          slot: "trw:processed-cavity-event"



    run-queue:
        - egg1
        - egg2


egg1:
    filename: "noElectronSignalFile.egg"
    egg-reader: egg3
    number-of-slices: 0
    slice-size: 8192

noise-gen1:
    mean: 0.0
    noise-floor-psd: 2.2e-13    # Noise power in W/Hz
    seed: 12345

fft1:
    transform-flag: ESTIMATE

acc:
    number-to-average: 0
    signal-interval: 0

gainvar:
    normalize: false
    min-frequency: 0
    max-frequency: 403e6
    fit-points: 50

egg2:
    filename: "$eggfilename"
    egg-reader: egg3
    number-of-slices: 0
    slice-size: 8192

noise-gen2:
    mean: 0.0
    noise-floor-psd: 2.2e-13    # Noise power in W/Hz
    seed: 12345

fft2:
    transform-flag: ESTIMATE

discrim:
    min-frequency: 105.e6         # Here we chop the frequency range to (100 +/-
    max-frequency: 168.e6        # 42.5) MHz, the active bandwidth of the RSA
    #snr-threshold-power: 6.0
    sigma-threshold: 9.0
    normalize: true
    neighborhood-radius: 2


seq-tr-clust:
    min-frequency: 0e6
    max-frequency: 403e6
    initial-slope : 0.1e6                # slope of a track with 1 point
    slope-method: weighted-first-point-ref
    n-slope-points: 10
    time-gap-tolerance: 0.1e-3
    frequency-acceptance: 56e3
    trimming-threshold: 6.0            # snr threshold for the first and last point of a candidate
    min-points: 3
    min-slope: 0

otc:
    max-track-width: 150e3          # For most tracks this only needs to be 150e3-ish. Only curved tracks profit from this number being bigger

itc:
    time-gap-tolerance: 1.0e-3
    frequency-acceptance: 100.0e3
    max-track-width: 100.0e3

tr-proc-ws:
    min-slope: 0

mptb:
    sideband-time-tol: 1e-3

mpeb:
    jump-time-tol: 3.0e-3

cavity-event-proc:
    max-rel-power-thresh: 0.1

ac1b:
    seq-line-nup-cut:               # can be applied after stf, after otc or after itc
        min-total-nup: 0
        min-average-nup: 7.0
        time-or-bin-average: bin
        wide-or-narrow: wide        # wide is default


event-nup-cut:
