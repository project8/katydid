processor-toolbox:
    processors:
      - type: egg-processor
        name: egg
      - type: forward-fftw
        name: fft
      - type: gaussian-noise-generator
        name: noise-gen
      - type: convert-to-power
        name: to-ps
      - type: basic-root-writer
        name: writer

    connections:
      - signal: "egg:header"
        slot: "fft:header"
      - signal: "egg:ts"
        slot: "noise-gen:slice"
      - signal: "noise-gen:slice" 
        slot: "fft:ts-fftw"
      - signal: "fft:fft"
        slot: "to-ps:fs-fftw-to-psd" 
      - signal: "to-ps:psd"
        slot: "writer:ps"
      - signal: "egg:ts"
        slot: "writer:ts"

    run-queue:
      - egg

egg:
    filename: "/path/to/file.root"
    egg-reader: egg3
    slice-size: 8192
    number-of-slices: 0

fft:
    transform-flag: ESTIMATE
    
noise-gen:
    mean: 0.0
    noise-floor-psd: 2.2e-13	# Noise power in W/Hz
    seed: 12345

writer:
    output-file: "/path/to/file.root"
    file-flag: recreate
